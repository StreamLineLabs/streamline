name: Release Gate

# The release gate is a *reusable* workflow. `release.yml` calls it and makes
# every publishing step depend on it, so the gate can never be bypassed by a
# tag push racing the release workflow.
on:
  workflow_call:
    inputs:
      check_only:
        description: 'Report criteria without blocking the release'
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Check criteria without blocking'
        type: boolean
        default: true

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  stability-audit:
    name: Module Stability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check stable module backward compatibility
        run: |
          echo "## Module Stability Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          STABLE_MODULES="server storage consumer protocol config error analytics embedded"
          ALL_PASS=true

          for mod in $STABLE_MODULES; do
            # Check if module exists and has no breaking API changes
            if [ -d "src/$mod" ] || [ -f "src/${mod}.rs" ] || [ -f "src/${mod}/mod.rs" ]; then
              echo "| $mod | ✅ Present |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $mod | ❌ Missing |" >> $GITHUB_STEP_SUMMARY
              ALL_PASS=false
            fi
          done

          # Check for #[deprecated] annotations in stable modules
          DEPRECATED=$(grep -r '#\[deprecated' src/server/ src/storage/ src/consumer/ src/protocol/ src/config/ src/error/ src/embedded.rs 2>/dev/null | wc -l | tr -d ' ')
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deprecated items in stable modules: $DEPRECATED" >> $GITHUB_STEP_SUMMARY

          if [ "$ALL_PASS" = false ]; then
            echo "::error::Stable module audit failed"
            exit 1
          fi

      - name: Enforce stability-tier import direction
        run: |
          chmod +x scripts/check_stability_tiers.sh
          ./scripts/check_stability_tiers.sh

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-gate-security

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit (fail closed)
        run: |
          set -euo pipefail
          echo "## Security Audit" >> "$GITHUB_STEP_SUMMARY"
          # Any non-zero exit (an advisory affecting the graph, or cargo-audit
          # itself failing to run) fails the gate: an audit that did not
          # complete is not a pass. Warning-level findings are governed by
          # deny.toml and enforced by the cargo-deny step below.
          if cargo audit --deny unsound 2>&1 | tee audit.log; then
            echo "cargo audit: clean" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "cargo audit: FAILED" >> "$GITHUB_STEP_SUMMARY"
            {
              echo ''
              echo '```'
              tail -n 100 audit.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::cargo audit reported advisories or failed to run"
            exit 1
          fi

      - name: Run cargo-deny (fail closed)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
          arguments: --all-features

      - name: Check unsafe usage
        run: python3 scripts/check_unsafe_budget.py
        env:
          # Baseline measured from this tree. This remains a source-level
          # ratchet, not a proof of soundness: it counts unsafe source lines
          # without an adjacent `SAFETY:` comment and ignores commented-out code.
          # It may only be lowered, never raised.
          UNSAFE_BUDGET: '120'

  api-compatibility:
    name: Kafka API Compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kafka-version: ['3.6.0', '3.7.0', '3.8.0']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build & Start
        run: |
          set -euo pipefail
          cargo build --release --locked
          ./target/release/streamline --in-memory &
          echo $! > streamline.pid
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:9094/health > /dev/null; then
              echo "streamline is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::streamline did not become healthy within 30s"
          exit 1

      - name: Download Kafka
        run: |
          set -euo pipefail
          wget -q https://archive.apache.org/dist/kafka/${{ matrix.kafka-version }}/kafka_2.13-${{ matrix.kafka-version }}.tgz
          tar xzf kafka_2.13-${{ matrix.kafka-version }}.tgz
          echo "KAFKA_HOME=$(pwd)/kafka_2.13-${{ matrix.kafka-version }}" >> $GITHUB_ENV

      - name: Core operations test
        run: |
          set -euo pipefail
          MSG="gate-message-${{ matrix.kafka-version }}"

          "$KAFKA_HOME/bin/kafka-topics.sh" --bootstrap-server localhost:9092 \
            --create --topic gate-test --partitions 3 --replication-factor 1

          "$KAFKA_HOME/bin/kafka-topics.sh" --bootstrap-server localhost:9092 --list \
            | tee topics.txt
          grep -qx 'gate-test' topics.txt

          echo "$MSG" | "$KAFKA_HOME/bin/kafka-console-producer.sh" \
            --broker-list localhost:9092 --topic gate-test

          # The consumer must actually return the produced payload. A timeout,
          # an empty read, or a mismatched body all fail the gate.
          timeout 30 "$KAFKA_HOME/bin/kafka-console-consumer.sh" \
            --bootstrap-server localhost:9092 --topic gate-test \
            --from-beginning --max-messages 1 > consumed.txt
          echo "consumed: $(cat consumed.txt)"
          grep -qxF "$MSG" consumed.txt

          "$KAFKA_HOME/bin/kafka-consumer-groups.sh" --bootstrap-server localhost:9092 --list
          "$KAFKA_HOME/bin/kafka-topics.sh" --bootstrap-server localhost:9092 \
            --delete --topic gate-test

      - name: Cleanup
        if: always()
        run: |
          if [ -f streamline.pid ]; then
            kill "$(cat streamline.pid)" 2>/dev/null || true
          fi

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # NOTE: no `| tail`, which would mask a non-zero cargo exit status.
      - name: Run tests
        run: cargo test --release --locked
      - name: Run cross-SDK tests
        # The cross-SDK matrix lives in its dedicated organization workflow.
        # This repository has no `cross_sdk_test` Cargo target; run the core
        # conformance integration target here instead of invoking a nonexistent
        # test binary.
        run: cargo test --locked --test conformance_test

  doc-completeness:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required docs
        run: |
          echo "## Documentation Completeness" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          REQUIRED_DOCS=(
            "docs/API_STABILITY.md"
            "docs/V1_RELEASE_CRITERIA.md"
            "docs/LAUNCH_CHECKLIST.md"
            "CHANGELOG.md"
            "SECURITY.md"
            "RELEASING.md"
            "README.md"
            "LICENSE"
          )

          ALL_PRESENT=true
          for doc in "${REQUIRED_DOCS[@]}"; do
            if [ -f "$doc" ]; then
              echo "| $doc | ✅ |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $doc | ❌ Missing |" >> $GITHUB_STEP_SUMMARY
              ALL_PRESENT=false
            fi
          done

          if [ "$ALL_PRESENT" = false ]; then
            echo "::error::Required documentation missing"
            exit 1
          fi

      - name: Check doc comments on public API
        run: |
          # Count pub fn without doc comments in stable modules
          MISSING=$(grep -B1 'pub fn ' src/embedded.rs src/server/mod.rs src/storage/mod.rs src/config/mod.rs src/consumer/mod.rs 2>/dev/null | grep -v '///' | grep 'pub fn' | wc -l | tr -d ' ')
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Public functions missing doc comments: $MISSING" >> $GITHUB_STEP_SUMMARY

  release-decision:
    name: Release Decision
    needs: [stability-audit, security-audit, api-compatibility, integration-tests, doc-completeness]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate gate
        run: |
          echo "## Release Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Stability Audit | ${{ needs.stability-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kafka Compatibility | ${{ needs.api-compatibility.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation | ${{ needs.doc-completeness.result }} |" >> $GITHUB_STEP_SUMMARY

          FAILURES=0
          for result in "${{ needs.stability-audit.result }}" "${{ needs.security-audit.result }}" "${{ needs.api-compatibility.result }}" "${{ needs.integration-tests.result }}" "${{ needs.doc-completeness.result }}"; do
            [ "$result" != "success" ] && FAILURES=$((FAILURES + 1))
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$FAILURES" -eq 0 ]; then
            echo "### ✅ RELEASE APPROVED" >> $GITHUB_STEP_SUMMARY
            echo "All release gate checks passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ RELEASE BLOCKED ($FAILURES failures)" >> $GITHUB_STEP_SUMMARY
            echo "Fix the failing checks before releasing." >> $GITHUB_STEP_SUMMARY
            if [ "${{ inputs.check_only }}" != "true" ]; then
              exit 1
            fi
          fi
