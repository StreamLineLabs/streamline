name: CI Full

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  version-sync:
    name: Version Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-version-sync.sh

  check:
    name: Check (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""               # Default (lite edition)
          - "--all-features" # Full edition
          - "--features kms,attestation,semantic-topics,agent-memory,branches,wasm-browser"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets ${{ matrix.features }}

  fmt:
    name: Format
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: '1.88'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: '1.88'
    strategy:
      matrix:
        features:
          - ""               # Default (lite edition)
          - "--all-features" # Full edition
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.edition.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        edition:
          - name: lite
            features: ""
          - name: full
            features: "--all-features"
          - name: moonshot
            features: "--features kms,attestation,semantic-topics,agent-memory,branches,wasm-browser"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test ${{ matrix.edition.features }}

  nextest:
    name: Nextest (lite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --profile ci

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  docs-sync:
    name: Docs Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/generate-cli-reference.sh --check
      - run: ./scripts/generate-config-reference.sh --check

  # Security scanning is centralised in .github/workflows/security-scan.yml so
  # there is exactly one fail-closed definition of the policy. It is re-run here
  # on the nightly schedule via the same reusable checks.
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-full-audit
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Fail closed: any advisory, or cargo-audit itself failing to run, fails
      # the job. Previously this used an action that could report without
      # blocking.
      - name: cargo audit
        run: cargo audit --deny unsound

  cargo-deny:
    name: Dependency Check (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
          arguments: --all-features

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins `channel = "stable"`; without this override
      # cargo would ignore the toolchain installed below and this job would
      # silently re-test stable instead of the MSRV.
      RUSTUP_TOOLCHAIN: '1.88'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: msrv-full
      - name: Confirm the MSRV toolchain is actually in use
        run: |
          set -euo pipefail
          ACTUAL=$(rustc --version | awk '{print $2}')
          echo "rustc in use: $ACTUAL (expected 1.88.x)"
          case "$ACTUAL" in
            1.88|1.88.*) ;;
            *)
              echo "::error::MSRV job is running rustc $ACTUAL, not 1.88"
              exit 1
              ;;
          esac
      - name: Build with MSRV
        run: cargo build --all-features --locked
      - name: Test with MSRV
        run: cargo test --all-features --locked

  benchmarks:
    name: Benchmark Compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile benchmarks
        run: cargo bench --no-run

  chaos-and-stress:
    name: Chaos & Stress Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build with all features
        run: cargo build --all-features

      - name: Run ignored tests (chaos, stress, compatibility)
        run: cargo test --all-features -- --ignored --test-threads=1
        env:
          RUST_LOG: warn
