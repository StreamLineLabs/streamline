name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: '1.88'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Lint & Test (Rust 1.88)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: '1.88'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          components: clippy
      - uses: Swatinem/rust-cache@v2

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    permissions:
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins an exact channel, and cargo honours that file
      # over whichever toolchain the action makes default. RUSTUP_TOOLCHAIN
      # takes precedence over rust-toolchain.toml, so this is what actually
      # makes the job build with the MSRV. Before the pin was corrected this
      # file said `channel = "stable"` and the job silently re-tested stable,
      # leaving the MSRV claim unverified.
      RUSTUP_TOOLCHAIN: '1.88'
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

