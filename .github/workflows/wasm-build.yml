name: WASM Build Size Check (planned M3)

# M3 has a feature flag but no `streamline-core-wasm` binary target yet. Keep
# this check manual until that target exists: silently skipping produced a
# false-green "size gate", while running it on every core PR would make all CI
# permanently red for an experimental artifact that cannot be built.
on:
  workflow_dispatch:

jobs:
  wasm-size-gate:
    name: streamline-core-wasm size budget
    runs-on: ubuntu-latest
    env:
      # See the toolchain step below: `rust-toolchain.toml` pins 1.88 and wins
      # over the action's default, so cargo must select the same toolchain the
      # wasm32 target was installed into.
      RUSTUP_TOOLCHAIN: '1.88'
    steps:
      - uses: actions/checkout@v4

      - name: Require the M3 WASM binary target
        run: |
          set -euo pipefail
          if ! grep -q '^name = "streamline-core-wasm"$' Cargo.toml; then
            echo "::error::M3 is not buildable yet: Cargo.toml does not declare the streamline-core-wasm binary target."
            exit 1
          fi

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          # Must match `rust-toolchain.toml` (1.88): that file takes precedence
          # over the action's default toolchain, so installing wasm32 into
          # `stable` left the toolchain cargo actually uses without the target.
          toolchain: '1.88'
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Install wasm-opt and gzip
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen gzip

      - name: Build streamline-core for WASM
        run: |
          set -euo pipefail
          cargo build \
            --target wasm32-unknown-unknown \
            --release \
            --no-default-features \
            --features wasm-browser \
            --bin streamline-core-wasm

      - name: Optimize and measure
        run: |
          set -euo pipefail
          WASM=target/wasm32-unknown-unknown/release/streamline-core-wasm.wasm
          if [ ! -f "$WASM" ]; then
            echo "::error::expected WASM artifact was not produced: $WASM"
            exit 1
          fi
          OPT_WASM="${RUNNER_TEMP}/streamline-core-wasm.opt.wasm"
          GZIP_WASM="${OPT_WASM}.gz"
          wasm-opt -Oz "$WASM" -o "$OPT_WASM"
          gzip -9 -c "$OPT_WASM" > "$GZIP_WASM"
          SIZE=$(stat -c%s "$GZIP_WASM")
          echo "Compressed wasm: $SIZE bytes"
          BUDGET=819200  # 800 KB
          if [ "$SIZE" -gt "$BUDGET" ]; then
            echo "::error::wasm exceeds 800KB gzipped budget ($SIZE > $BUDGET)"
            exit 1
          fi
