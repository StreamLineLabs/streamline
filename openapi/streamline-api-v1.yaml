components:
  parameters:
    TopicName:
      name: topic
      in: path
      required: true
      description: Topic name
      schema:
        type: string
        pattern: '^[a-zA-Z0-9._-]+$'
        minLength: 1
        maxLength: 255
      example: events

  schemas:
    AcknowledgeRequest:
      type: object
      properties:
        acknowledged_by:
          type: string

    ActiveAlerts:
      type: object
      required:
        - alerts
        - total
        - timestamp
      properties:
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/DashboardApiAlert"
          description: "List of active alerts"
        total:
          type: integer
          description: "Total count"
        timestamp:
          type: integer
          format: int64
          description: Timestamp

    ActivityMetrics:
      type: object
      required:
        - messages_1m
        - messages_5m
        - messages_1h
        - peak_mps
      properties:
        messages_1m:
          type: integer
          format: int64
          description: "Messages in last minute"
        messages_5m:
          type: integer
          format: int64
          description: "Messages in last 5 minutes"
        messages_1h:
          type: integer
          format: int64
          description: "Messages in last hour"
        peak_mps:
          type: number
          format: double
          description: "Peak messages per second"

    ActivityPoint:
      type: object
      required:
        - timestamp
        - messages
      properties:
        timestamp:
          type: integer
          format: int64
          description: Timestamp
        messages:
          type: integer
          format: int64
          description: "Message count"

    ActivityQuery:
      type: object
      properties:
        duration:
          type: string
          description: "Duration for timeline (default: \"1h\")"

    AddEdgeRequest:
      type: object
      required:
        - source
        - target
        - edge_type
      properties:
        source:
          type: string
        target:
          type: string
        edge_type:
          $ref: "#/components/schemas/LineageEdgeType"
        metadata:
          type: object
          additionalProperties:
            type: string

    AddMemberRequest:
      type: object
      required:
        - node_id
        - raft_addr
      properties:
        node_id:
          type: integer
          format: int64
          description: "Node ID for the new member"
        raft_addr:
          type: string
          description: "Raft address (inter-broker) for the new member"
        promote_to_voter:
          type: boolean
          description: "Whether to promote to voter immediately (default: true)"

    AggregateThroughput:
      type: object
      required:
        - messages_per_second
        - bytes_in_per_second
        - bytes_out_per_second
      properties:
        messages_per_second:
          type: number
          format: double
          description: "Total messages per second"
        bytes_in_per_second:
          type: number
          format: double
          description: "Total bytes in per second"
        bytes_out_per_second:
          type: number
          format: double
          description: "Total bytes out per second"

    AggregationWindowRequest:
      type: object
      required:
        - name
        - duration_seconds
      properties:
        name:
          type: string
        duration_seconds:
          type: integer
          format: int64
        window_type:
          type: string
        slide_seconds:
          type: integer
          format: int64

    AiApiCreatePipelineRequest:
      type: object
      required:
        - name
        - source_topics
        - stages
      properties:
        name:
          type: string
        source_topics:
          type: array
          items:
            type: string
        sink_topic:
          type: string
        stages:
          type: array
          items:
            $ref: "#/components/schemas/StageConfig"
        max_concurrency:
          type: integer
        batch_size:
          type: integer

    AiApiRetrievedContext:
      type: object
      required:
        - text
        - score
        - source
        - metadata
      properties:
        text:
          type: string
        score:
          type: number
          format: float
        source:
          type: string
        metadata: {}

    AiApiSearchRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
        limit:
          type: integer
        topics:
          type: array
          items:
            type: string

    AiApiSearchResult:
      type: object
      required:
        - score
        - topic
        - offset
        - value
      properties:
        score:
          type: number
          format: double
        topic:
          type: string
        offset:
          type: integer
          format: int64
        value:
          type: string

    AiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    AiPipelinePipelineInfo:
      type: object
      required:
        - name
        - source_topics
        - stage_count
        - state
        - metrics
      properties:
        name:
          type: string
        source_topics:
          type: array
          items:
            type: string
        sink_topic:
          type: string
        stage_count:
          type: integer
        state:
          $ref: "#/components/schemas/AiPipelinePipelineState"
        metrics:
          $ref: "#/components/schemas/PipelineMetricsSnapshot"

    AlertConfig:
      type: object
      required:
        - id
        - name
        - condition
        - threshold
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: "Unique alert ID"
        name:
          type: string
          description: "Alert name"
        description:
          type: string
          description: "Alert description"
        condition:
          allOf:
            -
              $ref: "#/components/schemas/AlertsAlertCondition"
          description: "Alert condition"
        threshold:
          type: number
          format: double
          description: "Threshold value"
        operator:
          type: string
          description: "Comparison operator (gt, gte, lt, lte, eq)"
        severity:
          allOf:
            -
              $ref: "#/components/schemas/AlertsAlertSeverity"
          description: "Alert severity"
        enabled:
          type: boolean
          description: "Whether the alert is enabled"
        channels:
          type: array
          items:
            $ref: "#/components/schemas/AlertsNotificationChannel"
          description: "Notification channels"
        interval_secs:
          type: integer
          format: int64
          description: "Evaluation interval in seconds"
        created_at:
          type: integer
          format: int64
          description: "Created timestamp"
        updated_at:
          type: integer
          format: int64
          description: "Last modified timestamp"

    AlertRuleConfig:
      type: object
      required:
        - id
        - name
        - metric
        - condition
        - threshold
        - duration_secs
        - severity
        - channels
      properties:
        id:
          type: string
        name:
          type: string
        metric:
          type: string
        condition:
          $ref: "#/components/schemas/ObservabilityApiAlertCondition"
        threshold:
          type: number
          format: double
        duration_secs:
          type: integer
          format: int64
        severity:
          type: string
        channels:
          type: array
          items:
            type: string

    AlertStats:
      type: object
      required:
        - total_alerts
        - enabled_alerts
        - total_events
        - recent_events
      properties:
        total_alerts:
          type: integer
          description: "Total configured alerts"
        enabled_alerts:
          type: integer
          description: "Number of enabled alerts"
        total_events:
          type: integer
          description: "Total events in history"
        recent_events:
          type: array
          items:
            $ref: "#/components/schemas/AlertsAlertEvent"
          description: "Recent alert events"

    AlertsAlertEvent:
      type: object
      required:
        - id
        - alert_id
        - alert_name
        - severity
        - condition
        - threshold
        - actual_value
        - timestamp
        - notified
      properties:
        id:
          type: string
          description: "Event ID"
        alert_id:
          type: string
          description: "Alert ID that triggered"
        alert_name:
          type: string
          description: "Alert name"
        severity:
          allOf:
            -
              $ref: "#/components/schemas/AlertsAlertSeverity"
          description: Severity
        condition:
          type: string
